    <!-- Set the theme early to avoid a flash of the wrong palette -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('kd-portfolio-settings');
          var t = raw ? JSON.parse(raw)?.state?.theme : null;
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
